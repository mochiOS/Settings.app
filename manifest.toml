format = 1

[package]
provenance = "built-in"
id = "org.mochios.settings"
name = "Settings"
version = "0.1.0"
revision = 1
vendor = "mochiOS"
kind = "application"
architecture = "x86_64"
abi = "mochios-1"

[application]
entry = "entry.elf"
description = "System settings for mochiOS"
icon = "appicon.png"
resources = ["appicon.png"]

[[binary]]
path = "/system/applications/Settings.app/entry.elf"
kind = "application"
requires = [
    "account.other.modify",
    "account.other.read",
    "clipboard.read",
    "clipboard.write",
    "control-center.read",
    "fs.read.all",
    "fs.write.all",
    "file-association.read",
    "file-association.write",
    "ipc.client",
    "ipc.server",
    "settings.read",
    "settings.write",
    "system.time.read",
    "window.create",
]
